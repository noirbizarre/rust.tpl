default_install_hook_types = ["pre-commit", "commit-msg"]

[[repos]]
repo = "builtin"
hooks = [
  { id = "check-added-large-files" },
  { id = "check-merge-conflict" },
  # `template/` holds files that are valid TOML/YAML by construction — the
  # rendered ones carry a `.jinja` suffix and are skipped by extension.
  { id = "check-toml" },
  { id = "check-yaml" },
  { id = "end-of-file-fixer" },
  { id = "mixed-line-ending" },
  { id = "trailing-whitespace" },
]

[[repos]]
repo = "https://github.com/alessandrojcm/commitlint-pre-commit-hook"
rev = "v9.21.0"

[[repos.hooks]]
id = "commitlint"
stages = ["commit-msg"]
additional_dependencies = ["@commitlint/config-conventional"]

# actionlint publishes its own hook manifest, so this uses that instead of
# hand-rolling a `repo = "local"` block: version bumps are then visible to
# `prek update` the same way the commitlint hook above already is, and
# `name`/`entry`/`files` come from the manifest — nothing to override. mise
# is a requirement to work on this project at all, so its shims already put
# the pinned `actionlint` on PATH; the `actionlint-system` hook's bare
# `entry = "actionlint"` finds it without help.
#
# Keep `rev` in step with `tools.actionlint` in mise.lock: nothing enforces
# the two agree.
[[repos]]
repo = "https://github.com/rhysd/actionlint"
rev = "v1.7.12"
hooks = [{ id = "actionlint-system" }]

# Mechanically enforces the same 120-column convention the template renders
# into every consumer — this repository's own README.md gets the same
# treatment.
[[repos]]
repo = "https://github.com/DavidAnson/markdownlint-cli2"
rev = "v0.23.2"

[[repos.hooks]]
id = "markdownlint-cli2"
files = "^README\\.md$"
# For the pretty output formatter .markdownlint-cli2.yaml configures — it
# needs to resolve alongside markdownlint-cli2 itself, and this installs it
# into the same node environment as the hook.
additional_dependencies = ["markdownlint-cli2-formatter-pretty"]

[[repos]]
repo = "local"

[[repos.hooks]]
id = "typos"
name = "typos"
language = "system"
entry = "typos"
pass_filenames = false

# The template's own checks: every `.jinja` file parses, no `${{ }}` sits
# outside a raw block, no conditional path segment renders to a stray suffix.
#
# This replaced a hand-written `find`/`grep` hook that only checked a raw block
# was opened *somewhere* in a file, only looked under `template/.github/` — so
# `template/cliff.toml.jinja`, whose body is Tera, was never covered — and
# shipped inert, with a `**` glob that matched one directory level because
# `bash -c` does not enable globstar.
[[repos.hooks]]
id = "template"
name = "git tpl lint"
language = "system"
# Through the mise task, so the "warnings are errors" decision lives in one
# place rather than in two that can disagree.
entry = "mise run lint:template"
pass_filenames = false
