default_install_hook_types = ["pre-commit", "commit-msg"]

[[repos]]
repo = "builtin"
hooks = [
  { id = "check-added-large-files" },
  { id = "check-merge-conflict" },
  # `template/` holds files that are valid TOML/YAML by construction — the
  # rendered ones carry a `.jinja` suffix and are skipped by extension.
  { id = "check-toml" },
  { id = "check-yaml" },
  { id = "end-of-file-fixer" },
  { id = "mixed-line-ending" },
  { id = "trailing-whitespace" },
]

[[repos]]
repo = "https://github.com/alessandrojcm/commitlint-pre-commit-hook"
rev = "v9.21.0"

[[repos.hooks]]
id = "commitlint"
stages = ["commit-msg"]
additional_dependencies = ["@commitlint/config-conventional"]

[[repos]]
repo = "local"

[[repos.hooks]]
id = "actionlint"
name = "actionlint"
language = "system"
entry = "actionlint"
files = "^\\.github/workflows/.*\\.ya?ml$"

[[repos.hooks]]
id = "typos"
name = "typos"
language = "system"
entry = "typos"
pass_filenames = false

# The template's own checks: every `.jinja` file parses, no `${{ }}` sits
# outside a raw block, no conditional path segment renders to a stray suffix.
#
# This replaced a hand-written `find`/`grep` hook that only checked a raw block
# was opened *somewhere* in a file, only looked under `template/.github/` — so
# `template/cliff.toml.jinja`, whose body is Tera, was never covered — and
# shipped inert, with a `**` glob that matched one directory level because
# `bash -c` does not enable globstar.
[[repos.hooks]]
id = "template"
name = "git tpl lint"
language = "system"
# Through the mise task, so the "warnings are errors" decision lives in one
# place rather than in two that can disagree.
entry = "mise run lint:template"
pass_filenames = false
