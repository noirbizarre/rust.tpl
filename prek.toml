default_install_hook_types = ["pre-commit", "commit-msg"]

# Generators own these bytes; hooks must not rewrite lockfiles or recordings.
exclude = { glob = [
  "mise.lock",
  "tests/__snapshots__/**",
  "template/**",
] }

[[repos]]
repo = "builtin"
hooks = [
  { id = "check-added-large-files" },
  { id = "check-merge-conflict" },
  # `template/` holds files that are valid TOML/YAML by construction — the
  # rendered ones carry a `.jinja` suffix and are skipped by extension.
  { id = "check-toml" },
  { id = "check-yaml" },
  { id = "end-of-file-fixer" },
  { id = "mixed-line-ending" },
  { id = "trailing-whitespace" },
]

[[repos]]
repo = "https://github.com/commitizen-tools/commitizen"
rev = "v4.19.3"

[[repos.hooks]]
id = "commitizen"
stages = ["commit-msg"]
additional_dependencies = ["emotional==0.6.1"]

[[repos]]
repo = "https://github.com/rhysd/actionlint"
rev = "v1.7.12"
hooks = [{ id = "actionlint-system" }]

[[repos]]
repo = "https://github.com/rvben/rumdl-pre-commit"
rev = "v0.3.2"

[[repos.hooks]]
id = "rumdl-check"
files = "^README\\.md$"

[[repos]]
repo = "https://github.com/crate-ci/typos"
rev = "v1.47.1"
hooks = [
  { id = "typos" },
  # Check the message before it enters release history; do not rewrite it.
  # Wait for https://github.com/crate-ci/typos/pull/1605 to avoid false positive on commit/rebase
  # { id = "typos", alias = "typos-commit-msg", args = ["--force-exclude"], stages = ["commit-msg"]},
]

[[repos]]
repo = "https://github.com/editorconfig-checker/editorconfig-checker"
rev = "v4.0.2"
# rumdl and rustfmt understand prose and embedded Rust strings; generic indentation checks do not.
hooks = [{ id = "editorconfig-checker", exclude_types = ["markdown", "rust"] }]

[[repos]]
repo = "local"

# The template's own checks: every `.jinja` file parses, no `${{ }}` sits
# outside a raw block, no conditional path segment renders to a stray suffix.
#
# This replaced a hand-written `find`/`grep` hook that only checked a raw block
# was opened *somewhere* in a file, only looked under `template/.github/` — so
# `template/cliff.toml.jinja`, whose body is Tera, was never covered — and
# shipped inert, with a `**` glob that matched one directory level because
# `bash -c` does not enable globstar.
[[repos.hooks]]
id = "template"
name = "git tpl lint"
language = "system"
# Through the mise task, so the "warnings are errors" decision lives in one
# place rather than in two that can disagree.
entry = "mise run lint:template"
pass_filenames = false
# Template files are globally excluded from file-oriented hooks.
always_run = true
