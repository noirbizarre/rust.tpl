# Tooling for developing the template itself.
#
# There is no Rust crate here — the only build is `git tpl render` into a
# scratch directory, and the only test is whether what comes out compiles.

[settings]
lockfile = true

# Every multi-line task below opens with a bash shebang. Without one mise runs
# the script through `sh`, which on a GitHub runner is dash: `set -o pipefail`
# is an error there and `< <(...)` is a syntax error. Locally `/bin/sh` is
# often a symlink to bash, so the difference is invisible until CI — which is
# exactly how it was found.

[tools]
prek = "latest"
typos = "latest"
actionlint = "latest"
# The aqua backend named explicitly. Left as a bare `shellcheck` it resolves to
# `asdf:shellcheck`, which carries no lockfile URLs — so `mise install --locked`,
# which mise-action runs as soon as it sees a mise.lock, fails on it.
"aqua:koalaman/shellcheck" = "latest"
# Needed by the `cargo:` backend below, or it builds from source instead.
cargo-binstall = "latest"
# The template engine. `cargo:` rather than `github:` or `ubi:`, which both
# install it fine and write no lockfile URLs — and `mise install --locked`,
# which mise-action runs as soon as a mise.lock exists, then fails on the entry
# it cannot verify. The same trap as `shellcheck` above, from the other
# direction: there the fix was naming a backend that locks, here it is naming
# one that needs no URL to.
#
# It is not a source build. git-tpl ships binstall metadata, so with
# cargo-binstall present this downloads a release archive — about three seconds
# against several minutes to compile a crate that vendors libgit2.
#
# An explicit version, never `latest`: mise applies a `minimum_release_age`, so
# `latest` resolves to whatever is old enough rather than to the newest release.
"cargo:git-tpl" = "0.4.0"

[tasks.default]
description = "Lint, then render and build both cases"
depends = ["lint", "test"]

[tasks.lint]
description = "Lint the template repository"
depends = ["spell", "lint:actions", "lint:template"]

[tasks.spell]
description = "Check spelling"
run = "typos"

[tasks."lint:actions"]
description = "Lint this repository's own workflows"
run = "actionlint .github/workflows/*.yaml"

[tasks."lint:template"]
description = "Check the template for the problems a render cannot find"
# A render only ever proves the branch it took. This parses every `.jinja` file
# including branches no answer set reaches, reports a `${{ }}` MiniJinja would
# consume, and catches a conditional path segment that renders to something
# like `.yaml` instead of being skipped — a real file, silently, which no
# amount of rendering the other case reveals when only one file is gated.
#
# Warnings fail here, though git-tpl exits 0 on them. That is the right default
# for git-tpl — a template may legitimately mean a `${{ }}` or an undeclared
# name — and the wrong one for this template, which has decided it never does:
# `tpl::lint::foreign_expression` is precisely the silent failure the README's
# `${{ }}` section is about, and the hand-written hook this replaced treated it
# as fatal. Keeping that severity is the point of the second call.
run = """
#!/usr/bin/env bash
set -euo pipefail
git tpl lint . --dirty
count=$(git tpl --json lint . --dirty |
  python3 -c 'import json, sys; print(json.load(sys.stdin)["warnings"])')
if [ "$count" != "0" ]; then
  echo "$count warning(s), which are errors in this repository" >&2
  exit 1
fi
"""

[tasks.render]
description = "Render one answer case into a scratch directory (default: full)"
# A usage spec rather than `raw_args`, so that `mise run render minimal`
# actually binds the word to something. Without it mise passes nothing through
# and the task silently renders the default case.
usage = 'arg "<case>" help="The answer case under tests/answers" default="full"'
# `--dirty` renders the working tree, not the last commit, which is what makes
# this an edit-and-see loop rather than an edit-commit-and-see one.
#
# `--strict-answers` because a key that names no question otherwise falls back
# to the question's default — and for `msrv`, `docs` or `publish` that silently
# deletes a whole conditional subtree while the warning scrolls past.
run = """
#!/usr/bin/env bash
set -euo pipefail
case="${usage_case:-full}"
out="${OUT:-$(mktemp -d)}"
git tpl render "$MISE_PROJECT_ROOT" --dirty \\
  --output "$out" --force \\
  --answers-from "$MISE_PROJECT_ROOT/tests/answers/$case.toml" \\
  --defaults --strict-answers
echo
echo "Rendered $case into $out"
"""

[tasks."check:tasks"]
description = "Fail if a rendered task name is shadowed by a mise builtin"
# `mise <task>` is shorthand for `mise tasks run <task>`, and a builtin
# subcommand of the same name wins it silently — `mise fmt` formats mise.toml
# rather than running the task, and reports nothing. mise's own documentation
# warns that new subcommands can claim a name in any release, so this is not a
# mistake that can be made once and then be over.
#
# `mise help <name>` is the oracle rather than a list written down here: it
# exits 0 for a builtin or one of its aliases and 2 for everything else,
# including tasks. Asking the installed mise is the whole point — a list in
# this repository would be correct on the day it was written and silently
# wrong afterwards.
usage = 'arg "<dir>" help="The rendered project to check" default="."'
run = """
#!/usr/bin/env bash
set -euo pipefail
dir="${usage_dir:-.}"
# Named explicitly rather than relying on `-C`: a bare `mise trust` scans for
# untrusted configs and reports finding none, which looks like a failure when
# it is not. The rendered mise.toml declares `[settings]` and per-task tools,
# so it is not one of the "safe" configs mise loads without trust.
mise trust "$dir/mise.toml" > /dev/null

shadowed=""
# `--local` matters: without it mise merges in the developer's global tasks
# from ~/.config/mise, and the check would fail on names the project does not
# control and cannot rename.
while read -r task; do
  [ -n "$task" ] || continue
  mise help "$task" > /dev/null 2>&1 && shadowed="$shadowed $task"
done < <(mise -C "$dir" tasks ls --local --name-only)

if [ -n "$shadowed" ]; then
  echo "shadowed by a mise builtin, so \\`mise <name>\\` will not reach them:$shadowed" >&2
  exit 1
fi
echo "no task name is shadowed by a mise builtin"
"""

[tasks.test]
description = "Render both cases and build the output"
# What `git tpl lint` cannot answer: whether the rendered project is a working
# Rust project. git-tpl deliberately runs nothing over a rendering, so this is
# where the real tools get pointed at it.
#
# `git tpl test` (git-tpl#26) will eventually subsume the file-level
# assertions — which files exist, which are absent, what they contain — but not
# these: building, testing and linting the output stays the author's job.
run = """
#!/usr/bin/env bash
set -euo pipefail
for case in minimal full; do
  out="$(mktemp -d)"
  echo "==> $case"
  OUT="$out" mise run render "$case"
  mise run check:tasks "$out"
  cd "$out"
  cargo build --all-targets
  cargo test
  cargo fmt --all -- --check
  cargo clippy --all-targets --all-features -- -D warnings
  # `-config-file` explicitly, and the workflow paths explicitly. `git tpl
  # render` writes a plain directory, and bare `actionlint` looks for a Git
  # repository to locate both the project and its own config — without one it
  # refuses to run, and when given file arguments it runs but silently ignores
  # `.github/actionlint.yml`, so the three deliberate suppressions in there stop
  # applying and the rendered workflows fail on known false positives.
  actionlint -config-file .github/actionlint.yml .github/workflows/*.yaml
  cd - > /dev/null
done
"""
