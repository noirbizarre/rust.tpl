# Tooling for developing the template itself.
#
# There is no Rust crate here — the only builds are the ones `git tpl test`
# runs itself, inside each test case's own `[commands]` (see tests/*.toml).

[settings]
lockfile = true

# Every multi-line task below opens with a bash shebang. Without one mise runs
# the script through `sh`, which on a GitHub runner is dash: `set -o pipefail`
# is an error there and `< <(...)` is a syntax error. Locally `/bin/sh` is
# often a symlink to bash, so the difference is invisible until CI — which is
# exactly how it was found.

[tools]
prek = "latest"
typos = "latest"
actionlint = "latest"
# Bare `shellcheck` resolves to `asdf:shellcheck`, which writes no lockfile
# URLs — `mise install --locked` (what mise-action runs) fails on it.
"aqua:koalaman/shellcheck" = "latest"
# Needed by the `cargo:` backend below, or it builds from source instead.
cargo-binstall = "latest"
# `cargo:` rather than `github:`/`ubi:`: both install fine but write no
# lockfile URLs, the same trap as `shellcheck` above. With cargo-binstall
# present this downloads a release archive, not a from-source build.
#
# Pinned, never `latest`: mise's `minimum_release_age` would resolve `latest`
# to whatever is old enough, not the newest release.
"cargo:git-tpl" = "0.11.0"

[tasks.default]
description = "Lint, then run every test case"
depends = ["lint", "test"]

[tasks.lint]
description = "Lint the template repository"
depends = ["spell", "lint:actions", "lint:template"]

[tasks.spell]
description = "Check spelling"
run = "typos"

[tasks."lint:actions"]
description = "Lint this repository's own workflows"
run = "actionlint .github/workflows/*.yaml"

[tasks."lint:template"]
description = "Check the template for the problems a render cannot find"
# `-D warnings`: git-tpl exits 0 on them, and this repository has decided that
# never means one.
run = "git tpl lint . --dirty -D warnings"

[tasks.test]
description = "Run the template's own test cases"
# `tests/*.toml`: `[expect]`, `snapshot`, and each case's own `[commands]`,
# which renders it, then runs `mise test`/`build`, `prek -a` and
# `gh ship validate` against it.
run = "git tpl test"

[tasks."test:write"]
description = "Re-record every case's snapshot"
run = "git tpl test --write"

[tasks.render]
description = "Render one answer case into a scratch directory (default: full)"
# A usage spec rather than `raw_args`, so `mise run render minimal` binds the
# word to something — without it mise passes nothing through and the task
# silently renders the default case.
usage = 'arg "<case>" help="The test case under tests/" default="full"'
run = """
#!/usr/bin/env bash
set -euo pipefail
case="${usage_case:-full}"
out="${OUT:-$(mktemp -d)}"
git tpl render "$MISE_PROJECT_ROOT" --dirty \\
  --output "$out" --force \\
  --answers-from "$MISE_PROJECT_ROOT/tests/$case.toml" \\
  --defaults --strict-answers
echo
echo "Rendered $case into $out"
"""

[tasks."check:tasks"]
description = "Fail if a rendered task name is shadowed by a mise builtin (manual use, against a mise run render output)"
# `mise <task>` is shorthand for `mise tasks run <task>`, and a builtin
# subcommand of the same name wins it silently — `mise fmt` formats mise.toml
# rather than running the task, and reports nothing.
#
# `mise help <name>` is the oracle rather than a list written down here: it
# exits 0 for a builtin or one of its aliases and 2 for everything else,
# including tasks.
usage = 'arg "<dir>" help="The rendered project to check" default="."'
run = """
#!/usr/bin/env bash
set -euo pipefail
dir="${usage_dir:-.}"
# Named explicitly: a bare `mise trust` scans for untrusted configs and finds
# none here, which looks like success but trusts nothing.
mise trust "$dir/mise.toml" > /dev/null

shadowed=""
# `--local`: without it mise also lists the developer's own global tasks.
while read -r task; do
  [ -n "$task" ] || continue
  mise help "$task" > /dev/null 2>&1 && shadowed="$shadowed $task"
done < <(mise -C "$dir" tasks ls --local --name-only)

if [ -n "$shadowed" ]; then
  echo "shadowed by a mise builtin, so \\`mise <name>\\` will not reach them:$shadowed" >&2
  exit 1
fi
echo "no task name is shadowed by a mise builtin"
"""
