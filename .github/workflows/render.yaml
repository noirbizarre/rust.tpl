name: ♻️ CI

# A bad render lands in every consuming repository at once.
#
# Three layers, and they answer different questions.
#
# `git tpl lint` (the 🕵️ Lint job, via prek) asks whether the template is a
# valid template: a file that does not parse, a `${{ }}` MiniJinja would eat, a
# conditional path segment that renders to a stray suffix.
#
# `git tpl test` asks whether each case renders what it should — which files
# appear, which must not, what they contain. That is the layer that proves a
# conditional slot was actually skipped rather than rendering something
# harmless, which "it built" never shows.
#
# Neither can say whether the output is a working Rust project, because git-tpl
# deliberately runs nothing over a rendering. So this job renders both cases and
# points the real tools at them.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: full
  PINNED_MISE_VERSION: 2026.7.18

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: 🕵️ Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v4
        with:
          version: ${{ env.PINNED_MISE_VERSION }}
          cache: true
      - name: Run hooks
        run: prek run --all-files --show-diff-on-failure

      # Not in the 🎨 Render matrix: one invocation covers every case, and a
      # failed `[expect]` is a two-second answer that should not wait behind a
      # Rust toolchain and two cargo builds.
      - name: Check the test cases
        run: mise run test:template

  render:
    name: 🎨 Render (${{ matrix.case }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # `minimal` is the one that matters: it is the case where every
        # conditional takes its other branch. `git tpl lint` now catches the
        # degenerate path segments statically, but not a workflow referencing a
        # task that only the maximal case renders, or a `when`-gated answer used
        # outside its guard — those need the branch actually taken.
        case: [minimal, full]
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2

      - uses: jdx/mise-action@v4
        with:
          version: ${{ env.PINNED_MISE_VERSION }}
          cache: true

      # `--dirty` renders the working tree rather than a committed revision,
      # which is the whole point: this must fail on the PR's changes, not on
      # what is already merged.
      #
      # `--strict-answers` so a key in the answer file that names no question
      # is an error rather than a silent fallback to the question's default.
      - name: Render the template
        run: |
          git tpl render "$GITHUB_WORKSPACE" --dirty \
            --output "$RUNNER_TEMP/out" --force \
            --answers-from "$GITHUB_WORKSPACE/tests/${{ matrix.case }}.toml" \
            --defaults --strict-answers

      # Before anything builds. The output is a plain directory, not a
      # repository, so this walks the filesystem — and after `cargo build` that
      # would mean walking `target/` and parsing whatever Cargo left there.
      - name: Check the rendered configuration parses
        working-directory: ${{ runner.temp }}/out
        run: |
          set -euo pipefail
          # A conditional that ate a closing bracket produces a file that looks
          # fine in a diff and fails at the first tool to read it. `git tpl lint`
          # proves the *template* parses as a template; this proves the *output*
          # parses as what it claims to be.
          find . -name '*.toml' -print0 | xargs -0 -r -n1 \
            python3 -c "import tomllib,sys; tomllib.load(open(sys.argv[1],'rb'))"
          find . \( -name '*.yml' -o -name '*.yaml' \) -print0 | xargs -0 -r -n1 \
            python3 -c "import yaml,sys; yaml.safe_load(open(sys.argv[1]))"

      - name: Build the rendered project
        working-directory: ${{ runner.temp }}/out
        run: cargo build --all-targets

      - name: Test the rendered project
        working-directory: ${{ runner.temp }}/out
        run: cargo test

      - name: Check the rendered formatting and lints
        working-directory: ${{ runner.temp }}/out
        run: |
          cargo fmt --all -- --check
          cargo clippy --all-targets --all-features -- -D warnings

      # actionlint is the backstop for the escaping mistakes this template is
      # most exposed to: a `${{ }}` that MiniJinja ate leaves valid YAML with a
      # meaningless expression, and only a workflow linter notices.
      #
      # `-config-file` explicitly. The rendered output is a plain directory, and
      # bare actionlint wants a Git repository to locate both the project and
      # its own config — without one it refuses to run, and when given file
      # arguments it runs but silently ignores `.github/actionlint.yml`, so the
      # deliberate suppressions in there stop applying.
      - name: Lint the rendered workflows
        working-directory: ${{ runner.temp }}/out
        run: actionlint -config-file .github/actionlint.yml .github/workflows/*.yaml

      # Not `working-directory: .../out`: the task is defined in this
      # repository and takes the rendered project as its argument, so that the
      # local loop (`mise run test`) and CI run the same check rather than two
      # copies of it that can drift.
      - name: Check no task name is shadowed by a mise builtin
        run: mise run check:tasks "$RUNNER_TEMP/out"

      - name: Validate the release setup
        working-directory: ${{ runner.temp }}/out
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh extension install noirbizarre/gh-ship
          # `validate` needs no network, no repository and no auth — it checks
          # the rendered .github/ship.yml against the workflows it names.
          gh ship validate
