# The workspace case: `workspace = true`, no member crates.
#
# This proves the virtual-manifest shape renders correctly and that `src/` and
# everything hard-coding `bin_name` (there is no root binary) disappear
# together. `msrv = true` is deliberate: it is the trickiest interaction, since
# `rust-version` moves from `[package]` to `[workspace.package]` and the MSRV
# CI job's grep has to keep matching either way.
#
# An empty workspace fails `cargo build` by Cargo's own design, so unlike
# `full`/`minimal`, this case's own `[commands]` stubs a member first.

snapshot = true

[answers]
crate = "workspace-example"
description = "Cargo.toml as a virtual manifest"
owner = "noirbizarre"
author = "Axel H. <noirbizarre@gmail.com>"
copyright_holder = "Axel H."
copyright_year = 2026
keywords = "cli"
categories = "command-line-utilities"
kind = "workspace"
msrv = true
msrv_version = "1.88"
publish = false
docs = false
targets = ["x86_64-unknown-linux-gnu"]
# bin_name omitted: `when = "not workspace"` means it is never asked here.

# `src/*.rs` and every conditional slot's absence prove the workspace shape
# actually skipped what it should, not merely rendered something harmless.
[expect]
absent = [
  "src/main.rs",
  "src/lib.rs",
  "src/cli.rs",
  "src/error.rs",
  "build.rs",
  ".github/workflows/homebrew.yaml",
  ".github/workflows/aur.yaml",
  ".github/workflows/docs.yaml",
  "zensical.toml",
  "docs/index.md",
  "docs/adr/README.md",
]
files = [
  "Cargo.toml",
  "mise.toml",
  "prek.toml",
  "cliff.toml",
  "README.md",
  "CONTRIBUTING.md",
  "AGENTS.md",
  ".github/workflows/ci.yaml",
  ".github/workflows/publish-release.yaml",
  ".editorconfig",
  ".markdownlint-cli2.yaml",
]

[expect.contains]
# The virtual-manifest shape is asserted here, and its absence of `[package]`
# and targets under `lacks` below.
"Cargo.toml" = [
  "[workspace]",
  "members = []",
  "[workspace.package]",
  'rust-version = "1.88"',
  "[workspace.dependencies]",
  "# --- project-specific ---",
]
# Not a binary, not published: the release workflow gh-ship waits on is a no-op.
".github/workflows/publish-release.yaml" = ["Nothing to publish"]

[expect.lacks]
# A virtual manifest: no package, no targets, no binary-only metadata, no CLI
# dependencies.
"Cargo.toml" = [
  "[package]\n",
  "[[bin]]",
  "[lib]",
  "binstall",
  "clap",
  "\n[dependencies]",
]
# No root binary: nothing to build per target, nothing to attach.
".github/workflows/publish-release.yaml" = [
  "matrix",
  "Package the Unix binaries",
  "Stage the asset",
  "📦 crates.io",
]
"mise.toml" = ["[tasks.cli]", "[tasks.setup]", "[tasks.man]"]

[commands]
before = ["cargo new crates/example --name example --vcs none"]
rendered = [
  '''sed -i "s#members = \[\]#members = [\"crates/example\"]#" Cargo.toml''',
  # the stub member has no tests, so `mise build` proves the shape, not `mise test`
  "mise build",
  # prek requires files to be git-tracked
  "git init -q",
  "git add .",
  "prek -a",
  "gh ship validate",
]
