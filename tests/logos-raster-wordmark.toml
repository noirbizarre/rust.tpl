# A raster wordmark takes precedence over an SVG icon for hero branding.
[answers]
crate = "mixed-example"
description = "Raster wordmark with SVG icon"
logos = ["icon", "raster-wordmark"]
docs = true

[expect]
files = ["docs/images/logo.png", "docs/images/icon.svg"]
absent = ["docs/images/logo.svg", "docs/images/icon.png"]

[expect.contains]
"README.md" = ['src="docs/images/logo.png"', 'width="480"']
"docs/index.md" = ['<h1 align="center"><img src="images/logo.png"']
"zensical.toml" = ['logo = "images/icon.svg"', 'favicon = "images/icon.svg"']

[expect.lacks]
"README.md" = ['src="docs/images/icon.svg"', '<h1 align="center">mixed-example</h1>']
"docs/index.md" = ['src="images/icon.svg"', "# mixed-example"]
