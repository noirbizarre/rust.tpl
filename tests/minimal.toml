# The minimal case: every optional slot off, one target.
#
# This is the case that catches conditionals which render an empty file rather
# than no file, and workflows that reference something only the maximal case
# provides.

snapshot = true

[answers]
crate = "minimal-example"
description = "Every optional slot turned off"
owner = "noirbizarre"
author = "Axel H. <noirbizarre@gmail.com>"
copyright_holder = "Axel H."
copyright_year = 2026
keywords = "cli"
categories = "command-line-utilities"
bin_name = "minimal-example"
kind = "library-and-binary"
msrv = false
mbx = false
publish = false
docs = false
targets = ["x86_64-unknown-linux-gnu"]

# Every conditional slot, all off. `absent` is the assertion that matters:
# the conditional-path idiom fails by producing a file rather than by erroring,
# so "it rendered and built" never proves a slot was actually skipped. (The MSRV
# job is a conditional block inside ci.yaml rather than a file, so it is
# asserted under `lacks` below.)
[expect]
absent = [
  ".github/workflows/docs.yaml",
  "zensical.toml",
  "docs/index.md",
  "docs/adr/README.md",
  "build.rs",
  ".github/workflows/homebrew.yaml",
  ".github/workflows/aur.yaml",
  "packaging/homebrew/minimal-example.rb",
  "packaging/aur/minimal-example-bin/PKGBUILD",
  "packaging/systemd/minimal-example.service",
  "NEXT-STEPS.md",
  "NEXT-STEPS.md.jinja",
]
files = [
  ".github/workflows/ci.yaml",
  ".github/workflows/ship.yaml",
  ".github/workflows/prepare-release.yaml",
  ".github/workflows/publish-release.yaml",
  ".github/workflows/template.yaml",
  "Cargo.toml",
  "mise.toml",
  "prek.toml",
  "cliff.toml",
  "src/main.rs",
  "src/lib.rs",
  "src/cli.rs",
  "src/error.rs",
  ".editorconfig",
  ".markdownlint-cli2.yaml",
]

[expect.contains]
# `publish = false` and the absent crates.io steps are one answer expressed twice,
# in two files that are edited independently.
"Cargo.toml" = [
  'name = "minimal-example"',
  "publish = false",
  "[package.metadata.binstall.overrides.x86_64-unknown-linux-gnu]",
]
"mise.toml" = ['tasks."tpl:check"', "lint:md", '[hooks]', 'postinstall = "prek install"']
".github/workflows/ci.yaml" = ["Disable Windows Defender real-time scanning", "mozilla-actions/sccache-action@", "Swatinem/rust-cache@", "RUSTC_WRAPPER: sccache", "files: lcov.info\n          token: ${{ secrets.CODECOV_TOKEN }}", "directory: target/nextest/ci\n          token: ${{ secrets.CODECOV_TOKEN }}"]
"CONTRIBUTING.md" = ["Mise's postinstall hook installs both", "Node.js and npm", "CODECOV_TOKEN", "Contents and Pull requests read/write permissions"]
# docs = false, so the prek hook and mise task must not reach into docs/.
"prek.toml" = ['README\\.md)$']

[expect.lacks]
"CONTRIBUTING.md" = ["Settings → Pages", "Trusted Publishing", "prek install"]
".github/workflows/publish-release.yaml" = ["crates.io", "Package the Unix binaries", "gzip -n", "jdx/mr-boxington-action@"]
"mise.toml" = ["mr_boxington", "mr-boxington", "RUSTUP_TOOLCHAIN", "MBX_GC_AUTO", "MBX_TARGET_VIEWS"]
# Cargo's automatic targets are enough when the binary is named after the
# crate, so neither explicit section is emitted.
"Cargo.toml" = ["[lib]", "[[bin]]"]
# The mirror of full.toml's positive assertion (`"crates.io"` present at
# publish-release.yaml:70): publish = false must drop the whole crates.io
# steps, not merely leave them unexercised.
# msrv = false must drop the job from ci.yaml, not merely leave it unexercised.
".github/workflows/ci.yaml" = ["🧓 MSRV", "rust-version", "jdx/mr-boxington-action@"]

[commands]
rendered = [
  "mise test",
  # prek requires files to be git-tracked
  "git init -q",
  "git add .",
  "prek -a",
  "gh ship validate",
]
