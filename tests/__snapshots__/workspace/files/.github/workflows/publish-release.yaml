
name: 📦 Publish Release
run-name: 📦 Publish Release ${{ inputs.ref || github.ref }}

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Run tag or commit SHA; leave blank for a manual main rebuild
        required: false
        type: string
  workflow_call:
    inputs:
      ref:
        required: true
        type: string

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  CARGO_NET_GIT_FETCH_WITH_CLI: "true"
  CARGO_NET_RETRY: "10"
  RUSTUP_MAX_RETRIES: "10"
  RUSTFLAGS: -D warnings
  # gh-ship runs on the version tag; main CI publishes to the rolling channel.
  TAG: ${{ startsWith(inputs.ref || github.ref, 'refs/tags/') && github.ref_name || vars.PRERELEASE_NAME || 'development' }}

jobs:

  publish:
    name: 🚀 Publish
    runs-on: ubuntu-latest
    # Only uploads serialize; builds remain parallel and no partial upload is cancelled.
    concurrency:
      group: publish-release
      cancel-in-progress: false
    steps:
      - run: echo 'Nothing to publish.'
