
name: 📦 Publish Release

# Dispatched by `gh ship release` on the tag it just created — naming the run
# after it tells the two apart in the Actions run list, where "Publish
# Release" alone would not.
run-name: 📦 Publish Release ${{ inputs.ref }}

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Qualified tag/branch ref or commit SHA to publish
        required: true
        type: string

  workflow_call:
    inputs:
      ref:
        required: true
        type: string

# The upload authenticates as a GitHub App and carries its own permissions.
# These cover `actions/checkout` alone, which only reads.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # Retries against a flaky registry/network rather than failing a release
  # build outright, and no incremental cache — this is a one-shot build, so
  # there is nothing later to reuse it.
  CARGO_INCREMENTAL: "0"
  CARGO_NET_GIT_FETCH_WITH_CLI: "true"
  CARGO_NET_RETRY: "10"
  RUSTUP_MAX_RETRIES: "10"
  # Same bar CI's clippy job already holds the code to; a release binary
  # should not ship a warning CI would have failed on for anyone else.
  RUSTFLAGS: -D warnings

jobs:
  resolve:
    name: 🔎 Resolve source
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.source.outputs.sha }}
      tag: ${{ steps.kind.outputs.tag }}
      prerelease: ${{ steps.kind.outputs.prerelease }}
    steps:
      - name: Classify the source ref
        id: kind
        env:
          BUILD_REF: ${{ inputs.ref }}
        shell: bash
        run: |
          # Qualified names avoid guessing when a branch and tag share a name.
          case "$BUILD_REF" in
            refs/tags/*|refs/heads/*) git check-ref-format "$BUILD_REF" ;;
            *)
              if [[ ! "$BUILD_REF" =~ ^[0-9a-fA-F]{40}$ ]]; then
                echo '::error::Use refs/tags/<tag>, refs/heads/<branch> or a full commit SHA.'
                exit 1
              fi
              ;;
          esac
          case "$BUILD_REF" in
            refs/tags/development) tag=development; prerelease=true ;;
            refs/tags/*) tag="${BUILD_REF#refs/tags/}"; prerelease=false ;;
            *) tag=development; prerelease=true ;;
          esac
          {
            echo "tag=$tag"
            echo "prerelease=$prerelease"
          } >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - name: Freeze the source commit
        id: source
        shell: bash
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
  # The whole release: this project builds no binary, so there are no assets to
  # attach and crates.io is the only place it is published. Publishing cannot be
  # undone — `cargo yank` hides a version from resolution but never removes it,
  # and the version number is spent forever — but the job is safe to re-run, see
  # the "already published" check below.
  crates:
    name: 📦 crates.io
    if: ${{ needs.resolve.outputs.prerelease == 'false' }}
    needs: resolve
    runs-on: ubuntu-latest

    # Must match the Environment configured under
    # crates.io -> library-example -> Settings -> Trusted Publishing. crates.io
    # checks the OIDC claim against it, and a mismatch is a 403 at publish time
    # rather than anything visible earlier.
    environment:
      name: release

    permissions:
      # The only permission Trusted Publishing needs: it mints the OIDC token
      # that is exchanged for a short-lived crates.io token. No API key is
      # stored anywhere, and nothing here writes to the repository.
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v7
        with:
          # The tag, not the branch tip. `cargo publish` packages the working
          # tree, so this is what decides which code reaches crates.io.
          ref: ${{ needs.resolve.outputs.sha }}
          # `cargo publish` authenticates via Trusted Publishing's OIDC
          # token, not a persisted checkout credential.
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      # `cargo publish` fails outright on a version that already exists, which
      # turns an ordinary "re-run failed jobs" into a stuck release: gh-ship
      # waits on this workflow and only undrafts the release when it succeeds.
      # A version can be uploaded and the job still fail afterwards, so this
      # makes the re-run a no-op rather than an error.
      #
      # The resolved tag is the version: this project tags without a `v` prefix, and
      # prepare-release derives both from one string.
      - name: Check whether this version is already published
        id: existing
        run: |
          set -euo pipefail
          url="https://crates.io/api/v1/crates/library-example/${{ needs.resolve.outputs.tag }}"
          if curl -sfL --retry 3 -H "User-Agent: library-example-release" "$url" > /dev/null; then
            echo "published=true" >> "$GITHUB_OUTPUT"
            echo "::notice::library-example ${{ needs.resolve.outputs.tag }} is already on crates.io; skipping."
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi

      # Exchanges the workflow's OIDC identity for a crates.io token that
      # lives 30 minutes, and revokes it in a post step when the job ends.
      # Skipped when there is nothing to publish, so no token is minted for a
      # job that will do nothing with it.
      - uses: rust-lang/crates-io-auth-action@v1
        id: auth
        if: steps.existing.outputs.published == 'false'

      # `--locked` so the published build resolves exactly the dependencies
      # Cargo.lock records. Without it a yanked or newly-broken transitive
      # dependency could change what is verified here versus what was tested.
      - name: Publish to crates.io
        if: steps.existing.outputs.published == 'false'
        run: cargo publish --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
