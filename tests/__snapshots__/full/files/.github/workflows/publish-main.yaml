name: 🚀 Main prerelease

# Called only after CI's checks succeed, using that run's exact build artifacts.
on:
  workflow_call:

permissions:
  contents: write

jobs:
  publish:
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'noirbizarre/full-example' }}
    runs-on: ubuntu-latest
    # Do not interrupt an upload; the helper rejects stale queued runs under this lock.
    concurrency:
      group: publish-main
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          pattern: asset-*
          merge-multiple: true
          path: dist
      - name: Publish the main channel
        run: python3 .github/scripts/publish-main.py
        env:
          GH_TOKEN: ${{ github.token }}
