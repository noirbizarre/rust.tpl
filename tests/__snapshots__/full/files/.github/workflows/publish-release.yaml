
name: 📦 Publish Release
run-name: 📦 Publish Release ${{ inputs.ref || github.ref }}

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Run tag or commit SHA; leave blank for a manual main rebuild
        required: false
        type: string
  workflow_call:
    inputs:
      ref:
        required: true
        type: string

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  CARGO_NET_GIT_FETCH_WITH_CLI: "true"
  CARGO_NET_RETRY: "10"
  RUSTUP_MAX_RETRIES: "10"
  RUSTFLAGS: -D warnings
  # A tag input must match the run tag; other accepted inputs publish to the rolling channel.
  TAG: ${{ startsWith(inputs.ref || github.ref, 'refs/tags/') && github.ref_name || vars.PRERELEASE_NAME || 'development' }}

jobs:

  build:
    name: 🏗️ Build (${{ matrix.build.label }})
    runs-on: ${{ matrix.build.runner }}
    strategy:
      fail-fast: false
      matrix:
        build:
          - { label: linux-amd64, target: x86_64-unknown-linux-gnu, runner: ubuntu-latest, cross: true }
          - { label: linux-arm64, target: aarch64-unknown-linux-gnu, runner: ubuntu-latest, cross: true }
          - { label: linux-amd64-musl, target: x86_64-unknown-linux-musl, runner: ubuntu-latest, cross: true }
          - { label: linux-arm64-musl, target: aarch64-unknown-linux-musl, runner: ubuntu-latest, cross: true }
          - { label: darwin-amd64, target: x86_64-apple-darwin, runner: macos-latest }
          - { label: darwin-arm64, target: aarch64-apple-darwin, runner: macos-latest }
          - { label: windows-amd64, target: x86_64-pc-windows-msvc, runner: windows-latest, ext: ".exe" }
          - { label: windows-arm64, target: aarch64-pc-windows-msvc, runner: windows-11-arm, ext: ".exe" }
          - { label: freebsd-amd64, target: x86_64-unknown-freebsd, runner: ubuntu-latest, cross: true }
    steps:

      - name: Validate publication source
        env:
          BUILD_REF: ${{ inputs.ref || github.ref }}
          CHANNEL_TAG: ${{ github.ref_name == (vars.PRERELEASE_NAME || 'development') }}
        run: |
          fail() { echo '::error::Publish the run tag, the main CI SHA, or manually run on main with ref blank.'; exit 1; }
          # Names enter filenames and gh's file#label syntax, so Git validity alone is insufficient.
          [[ "$TAG" =~ ^[a-zA-Z0-9][a-zA-Z0-9._+-]*$ ]] || fail
          git check-ref-format "refs/tags/$TAG" || fail
          case "$BUILD_REF" in
            refs/tags/*)
              [[ "$BUILD_REF" == "$GITHUB_REF" && "$CHANNEL_TAG" != true ]] || fail
              ;;
            *)
              [[ "$GITHUB_REPOSITORY" == 'noirbizarre/full-example' && "$GITHUB_REF" == refs/heads/main ]] || fail
              [[ "$BUILD_REF" == "$GITHUB_SHA" || ("$GITHUB_EVENT_NAME" == workflow_dispatch && "$BUILD_REF" == refs/heads/main) ]] || fail
              ;;
          esac
      - uses: actions/checkout@v7
        with:
          # Every matrix leg uses the immutable run commit, even if a tag or main moves later.
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.build.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.build.target }}
      - uses: taiki-e/install-action@cross
        if: matrix.build.cross
      # Standalone Windows binaries must start without a separately installed redistributable.
      - name: Statically link the MSVC C runtime
        if: endsWith(matrix.build.target, 'windows-msvc')
        run: echo "RUSTFLAGS=${RUSTFLAGS} -C target-feature=+crt-static" >> "$GITHUB_ENV"
      - name: Build and stage the asset
        env:
          TARGET: ${{ matrix.build.target }}
          LABEL: ${{ matrix.build.label }}
          CROSS: ${{ matrix.build.cross }}
          EXT: ${{ matrix.build.ext }}
        run: |
          if [ "${CROSS:-}" = true ]; then
            cross build --release --locked --target "$TARGET"
          else
            cargo build --release --locked --target "$TARGET"
          fi
          mkdir -p dist
          cp "target/${TARGET}/release/full-example${EXT:-}" "dist/full-example_${TAG}_${LABEL}${EXT:-}"
      - uses: actions/upload-artifact@v7
        with:
          name: asset-${{ matrix.build.label }}
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  publish:
    name: 🚀 Publish
    needs: build
    runs-on: ubuntu-latest
    # Only uploads serialize; builds remain parallel and no partial upload is cancelled.
    concurrency:
      group: publish-release
      cancel-in-progress: false
    environment:
      name: release
      url: ${{ github.server_url }}/${{ github.repository }}/releases/tag/${{ env.TAG }}
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          pattern: asset-*
          merge-multiple: true
          path: dist
      - name: Require every binary
        run: |
          assets=("full-example_${TAG}_linux-amd64" "full-example_${TAG}_linux-arm64" "full-example_${TAG}_linux-amd64-musl" "full-example_${TAG}_linux-arm64-musl" "full-example_${TAG}_darwin-amd64" "full-example_${TAG}_darwin-arm64" "full-example_${TAG}_windows-amd64.exe" "full-example_${TAG}_windows-arm64.exe" "full-example_${TAG}_freebsd-amd64" )
          for asset in "${assets[@]}"; do test -s "dist/$asset"; done
      # Generate host-independent text once, rather than executing cross-compiled binaries.
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Generate man pages and completions
        run: |
          out=$(cargo build --locked --message-format=json 2>/dev/null \
            | jq -r 'select(.reason == "build-script-executed") | select(.package_id | test("full-example")) | .out_dir' \
            | tail -n 1)
          test -n "$out" || { echo 'could not locate OUT_DIR' >&2; exit 1; }
          mkdir -p stage/man stage/completions
          cp "$out"/man/*.1 stage/man/
          cp "$out"/completions/* stage/completions/
      # Both channels exercise the same reproducible prefix layout; Windows keeps its .exe.
      - name: Package the Unix binaries
        run: |
          export LC_ALL=C
          umask 022
          epoch=$(git log -1 --format=%ct)
          assets=(linux-amd64 linux-arm64 linux-amd64-musl linux-arm64-musl darwin-amd64 darwin-arm64 freebsd-amd64 )
          for asset in "${assets[@]}"; do
            name="full-example-${TAG}-${asset}"
            root="stage/${name}"
            put() { if [ -f "$2" ]; then install -D -m "$1" "$2" "${root}/$3"; fi; }
            install -D -m 755 "dist/full-example_${TAG}_${asset}" "${root}/bin/full-example"
            install -D -m 644 LICENSE "${root}/share/doc/full-example/LICENSE"
            install -D -m 644 README.md "${root}/share/doc/full-example/README.md"
            for page in stage/man/*.1; do put 644 "$page" "share/man/man1/$(basename "$page")"; done
            put 644 stage/completions/full-example.bash "share/bash-completion/completions/full-example"
            put 644 stage/completions/_full-example "share/zsh/site-functions/_full-example"
            put 644 stage/completions/full-example.fish "share/fish/vendor_completions.d/full-example.fish"
            install -D -m 644 packaging/systemd/full-example.service "${root}/lib/systemd/user/full-example.service"
            tar -C stage --sort=name --format=gnu --mtime="@${epoch}" \
              --owner=0 --group=0 --numeric-owner -cf - "$name" \
              | gzip -n -9 > "dist/full-example_${TAG}_${asset}.tar.gz"
          done
      - name: Checksums
        working-directory: dist
        run: sha256sum -- * > SHA256SUMS
      - uses: actions/create-github-app-token@v3
        id: app-token
        with:
          client-id: ${{ vars.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
      - name: Prepare the release destination
        id: destination
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          BUILD_REF: ${{ inputs.ref || github.ref }}
          IS_RELEASE: ${{ startsWith(inputs.ref || github.ref, 'refs/tags/') }}
        run: |
          if [ "$IS_RELEASE" = true ]; then
            # Peel annotated tags too; a moved stable tag must not receive another commit's binaries.
            test "$(gh api "repos/${GITHUB_REPOSITORY}/commits/${BUILD_REF}" --jq .sha)" = "$GITHUB_SHA"
            # gh-ship owns creation, notes and visibility for versioned releases.
            gh release view "$TAG" --json tagName >/dev/null
          else
            # Manual main housekeeping may intentionally rebuild after main has advanced.
            if [ "$GITHUB_EVENT_NAME" != workflow_dispatch ]; then
              head=$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq .object.sha)
              if [ "$head" != "$GITHUB_SHA" ]; then
                echo '::notice::Newer main commit exists; skipping this prerelease.'
                exit 0
              fi
            fi
            releases=$(gh api --paginate "repos/${GITHUB_REPOSITORY}/releases?per_page=100" --slurp)
            release=$(jq -c --arg tag "$TAG" '.[][] | select(.tag_name == $tag)' <<< "$releases")
            if [ -n "$release" ]; then
              test "$(jq -r .prerelease <<< "$release")" = true
            else
              gh release create "$TAG" --target "$GITHUB_SHA" --title "$TAG" \
                --notes 'Pending development binaries' --draft --prerelease --latest=false
            fi
          fi
          echo 'ready=true' >> "$GITHUB_OUTPUT"
      - name: Upload assets to the release
        if: steps.destination.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          for asset in dist/*; do
            gh release upload "$TAG" "${asset}#${GITHUB_SHA}" --clobber
          done
      - name: Update the rolling prerelease tag
        if: ${{ steps.destination.outputs.ready == 'true' && !startsWith(inputs.ref || github.ref, 'refs/tags/') }}
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          # Only advertise the commit after every asset has uploaded successfully.
          refs=$(gh api "repos/${GITHUB_REPOSITORY}/git/matching-refs/tags/${TAG}")
          if jq -e --arg ref "refs/tags/$TAG" 'any(.[]; .ref == $ref)' <<< "$refs" >/dev/null; then
            gh api -X PATCH "repos/${GITHUB_REPOSITORY}/git/refs/tags/${TAG}" \
              -f sha="$GITHUB_SHA" -F force=true --silent
          else
            gh api -X POST "repos/${GITHUB_REPOSITORY}/git/refs" \
              -f "ref=refs/tags/$TAG" -f sha="$GITHUB_SHA" --silent
          fi
      - name: Finalize the prerelease
        if: ${{ steps.destination.outputs.ready == 'true' && !startsWith(inputs.ref || github.ref, 'refs/tags/') }}
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          gh release edit "$TAG" --title "$TAG" --prerelease --draft=false --latest=false \
            --notes "Main SHA: ${GITHUB_SHA}. CI: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          release_id=$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${TAG}" --jq .id)
          assets=$(gh api --paginate "repos/${GITHUB_REPOSITORY}/releases/${release_id}/assets?per_page=100" --slurp)
          # Derive obsolete assets from the shared payload, including any configured archives.
          while IFS=$'\t' read -r id name; do
            if [ ! -f "dist/$name" ]; then
              gh api -X DELETE "repos/${GITHUB_REPOSITORY}/releases/assets/${id}" --silent
            fi
          done < <(jq -r '.[][] | [.id, .name] | @tsv' <<< "$assets")
      # Last: an irreversible crates.io publication must follow successful binary uploads.
      - name: Check whether this version is already published
        id: existing
        if: startsWith(inputs.ref || github.ref, 'refs/tags/')
        run: |
          status=$(curl -sS -o /dev/null -w '%{http_code}' --retry 3 \
            -H 'User-Agent: full-example-release' "https://crates.io/api/v1/crates/full-example/${TAG}")
          case "$status" in
            200) echo 'published=true' >> "$GITHUB_OUTPUT" ;;
            404) echo 'published=false' >> "$GITHUB_OUTPUT" ;;
            *) echo '::error::Could not check the existing crate version; retry publication.'; exit 1 ;;
          esac
      - uses: rust-lang/crates-io-auth-action@v1
        id: auth
        if: startsWith(inputs.ref || github.ref, 'refs/tags/') && steps.existing.outputs.published == 'false'
      - name: Publish to crates.io
        if: startsWith(inputs.ref || github.ref, 'refs/tags/') && steps.existing.outputs.published == 'false'
        run: cargo publish --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
