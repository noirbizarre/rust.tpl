[answers]
crate = "wordmark-example"
description = "Wordmark without an icon"
logos = ["wordmark"]
docs = true

[expect]
files = ["docs/images/logo.svg"]
absent = ["docs/images/icon.svg", "docs/images/logo.png", "docs/images/icon.png"]

[expect.contains]
"README.md" = ['<img src="docs/images/logo.svg" alt="wordmark-example">']
"docs/index.md" = ['<h1 align="center"><img src="images/logo.svg"']
"docs/images/logo.svg" = ['viewBox="0 0 504 80"', '>wordmark-example</text>']

[expect.lacks]
"README.md" = ["icon.svg", '<h1 align="center">wordmark-example</h1>']
"docs/index.md" = ["icon.svg", "# wordmark-example"]
"zensical.toml" = ["logo =", "favicon ="]
