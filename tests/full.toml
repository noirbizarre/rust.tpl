# The maximal case: every optional slot on, the full target matrix.

snapshot = true

[answers]
crate = "full-example"
description = "Every optional slot turned on"
owner = "noirbizarre"
author = "Axel H. <noirbizarre@gmail.com>"
copyright_holder = "Axel H."
copyright_year = 2026
keywords = "cli, example, template, rust, scaffolding"
categories = "command-line-utilities, development-tools"
bin_name = "full-example"
kind = "library-and-binary"
msrv = true
mbx = true
msrv_version = "1.88"
man_pages = true
archive = true
service = true
rolling_prerelease = true
publish = true
docs = true
docs_accent = "deep orange"
homebrew = true
homebrew_tap = "noirbizarre/homebrew-tap"
aur = true
targets = [
  "x86_64-unknown-linux-gnu",
  "aarch64-unknown-linux-gnu",
  "x86_64-unknown-linux-musl",
  "aarch64-unknown-linux-musl",
  "x86_64-apple-darwin",
  "aarch64-apple-darwin",
  "x86_64-pc-windows-msvc",
  "aarch64-pc-windows-msvc",
  "x86_64-unknown-freebsd",
]

# Every conditional slot on. The mirror of `minimal`: what that one asserts is
# absent, this asserts is present, so a slot that stopped rendering altogether
# fails here rather than passing both cases quietly.
[expect]
files = [
  ".github/workflows/docs.yaml",
  ".github/workflows/template.yaml",
  "zensical.toml",
  "docs/index.md",
  "docs/adr/README.md",
  "Cargo.toml",
  ".editorconfig",
  ".markdownlint-cli2.yaml",
  "build.rs",
  ".github/workflows/homebrew.yaml",
  ".github/workflows/aur.yaml",
  "packaging/homebrew/full-example.rb",
  "packaging/aur/full-example-bin/PKGBUILD",
  "packaging/systemd/full-example.service",
]

[expect.contains]
"Cargo.toml" = [
  'name = "full-example"',
  'rust-version = "1.88"',
  "[package.metadata.binstall]",
  "[package.metadata.binstall.overrides.aarch64-pc-windows-msvc]",
  "[build-dependencies]",
  "clap_mangen",
]
# The MSRV job greps this literal line out of Cargo.toml, so the two have to
# agree — and they are rendered from different answers in different files.
".github/workflows/ci.yaml" = [
  "jdx/mr-boxington-action@v1", "save-on-pull-request: true", "run: mbx check --all-targets", "mbx build --locked", "cache-generation: lint-v1", "cache-generation: pr-build-${{ matrix.build.target }}-v1",
  "🧓 MSRV", "rust-version", "id-token: write", "  prerelease:", "name: 🚀 Development prerelease", "ref: ${{ github.sha }}", "if: github.event_name == 'pull_request'",
  "    uses: ./.github/workflows/publish-release.yaml\n    # Environment secrets also require forwarding across workflow_call.\n    secrets: inherit\n    with:",
  "      matrix:\n        build:\n          - { label: linux-amd64, target: x86_64-unknown-linux-gnu, runner: ubuntu-latest, cross: true }",
  "runs-on: ${{ matrix.build.runner }}",
  "targets: ${{ matrix.build.target }}",
]
".github/workflows/prepare-release.yaml" = [
  "cargo update --workspace",
  "gh ship sign",
  "name: ship-release",
  "path: ship.release.json",
  "if-no-files-found: error",
]
".github/workflows/publish-release.yaml" = [
  "jdx/mr-boxington-action@", "backend: local", "mbx build --release --locked",
  "    environment:\n      name: release",
  "          client-id: ${{ vars.APP_CLIENT_ID }}\n          private-key: ${{ secrets.APP_PRIVATE_KEY }}",
  "crates.io",
  # archive = true: the tarball step, in the layout memcastle's ADR-013 fixes.
  "Package the Unix binaries",
  "Generate man pages and completions",
  "share/doc/full-example",
  "lib/systemd/user/full-example.service",
  "gzip -n -9",
  "cancel-in-progress: false",
  "actions/download-artifact",
  "name: Publish to crates.io\n        if: startsWith(inputs.ref || github.ref, 'refs/tags/')",
  "aarch64-pc-windows-msvc",
  "x86_64-unknown-freebsd",
  "target-feature=+crt-static",
  "Build and stage the asset",
  "matrix.build.label",
  "vars.PRERELEASE_NAME || 'development'",
]
"zensical.toml" = ['accent = "deep orange"']
"mise.toml" = ["docs:build", "lint:md", 'docs/**/*.md', "[tasks.man]", 'mr_boxington = true', 'mr-boxington = "1.28.0"', 'version = "stable"']
# Regression tripwire for the bot-contributor filter: `github.contributors`
# is unfiltered by `commit_parsers`, so without this every bot with a merged
# PR — dependabot, the release bot — would be credited as a first-timer.
"cliff.toml" = ['is ending_with("[bot]")']
"prek.toml" = [
  'docs/.*\\.md',
  'repo = "https://github.com/crate-ci/typos"',
  'alias = "typos-commit-msg"',
  'args = ["--force-exclude"]',
  'stages = ["commit-msg"]',
]
"packaging/homebrew/full-example.rb" = [
  "class FullExample",
  "@SHA256_DARWIN_ARM64@",
  "@SHA256_LINUX_AMD64_MUSL@",
  "@SHA256_LINUX_ARM64_MUSL@",
  "man1.install",
  "zsh_completion.install",
]
"packaging/aur/full-example-bin/PKGBUILD" = [
  "pkgname=full-example-bin",
  "_pkgname=full-example",
  'provides=("$_pkgname=$pkgver")',
  'conflicts=("$_pkgname")',
  "@SHA256_X86_64@",
  "@SHA256_AARCH64@",
  "linux-amd64.tar.gz",
  "cp -a lib",
]
"packaging/systemd/full-example.service" = ["ExecStart=/usr/bin/full-example"]
".github/workflows/homebrew.yaml" = ["noirbizarre/homebrew-tap"]
".github/workflows/aur.yaml" = ["full-example-bin"]

[expect.lacks]
".github/workflows/ci.yaml" = ["sccache", "Swatinem/rust-cache", "RUSTC_WRAPPER", "--release", "build: false", "needs: [lint", "  development:", "actions/upload-artifact"]
".github/workflows/publish-release.yaml" = ["inputs.build", "inputs.tag", "inputs.prerelease", "needs.resolve", "  resolve:", "  crates:", "include:", 'ext: ""', "build-release.yaml", "Swatinem/rust-cache", "github-cache-mode:"]
# Historical spelling must not make git-cliff silently drop release commits.
"cliff.toml" = ["typos --write-changes"]
# PR CI builds the release; the orchestrator validates the uploaded artifact.
".github/workflows/prepare-release.yaml" = [
  "cargo build",
  "Swatinem/rust-cache",
  "gh ship validate ship.release.json",
]
# archive = true: the licence and unit come out of the tarball, so the AUR
# workflow must not also fetch and hash them from the tag.
".github/workflows/aur.yaml" = ["SHA256_LICENSE", "SHA256_SERVICE"]
"packaging/aur/full-example-bin/PKGBUILD" = ["SHA256_LICENSE"]

[commands]
rendered = [
  "mise test",
  # prek requires files to be git-tracked
  "git init -q",
  "git add .",
  "prek -a",
  "gh ship validate",
]
