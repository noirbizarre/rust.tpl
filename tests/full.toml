# The maximal case: every optional slot on, the full target matrix.
#
# Rendered and built by .github/workflows/render.yaml.

# Answers nest under `[answers]` because this is a `git tpl test` case, and
# `[expect]` sits alongside them. `--answers-from` reads the same file, so the
# render tasks and the test runner cannot drift onto different inputs.

[answers]
crate = "full-example"
description = "Every optional slot turned on"
owner = "noirbizarre"
author = "Axel H. <noirbizarre@gmail.com>"
copyright_holder = "Axel H."
copyright_year = 2026
keywords = "cli, example, template, rust, scaffolding"
categories = "command-line-utilities, development-tools"
bin_name = "full-example"
msrv = true
msrv_version = "1.88"
publish = true
docs = true
docs_accent = "deep orange"
targets = [
  "x86_64-unknown-linux-gnu",
  "aarch64-unknown-linux-gnu",
  "x86_64-unknown-linux-musl",
  "aarch64-unknown-linux-musl",
  "x86_64-apple-darwin",
  "aarch64-apple-darwin",
  "x86_64-pc-windows-msvc",
  "aarch64-pc-windows-msvc",
]

# Every conditional slot on. The mirror of `minimal`: what that one asserts is
# absent, this asserts is present, so a slot that stopped rendering altogether
# fails here rather than passing both cases quietly.
[expect]
files = [
  ".github/workflows/msrv.yaml",
  ".github/workflows/docs.yaml",
  ".github/workflows/template.yaml",
  "zensical.toml",
  "docs/index.md",
  "docs/adr/README.md",
  "Cargo.toml",
]

[expect.contains]
"Cargo.toml" = ['name = "full-example"', 'rust-version = "1.88"']
# The MSRV job greps this literal line out of Cargo.toml, so the two have to
# agree — and they are rendered from different answers in different files.
".github/workflows/msrv.yaml" = ["rust-version"]
".github/workflows/publish-release.yaml" = ["crates.io", "aarch64-pc-windows-msvc"]
"zensical.toml" = ['accent = "deep orange"']
"mise.toml" = ["docs:build"]
