# The maximal case: every optional slot on, the full target matrix.

snapshot = true

[answers]
crate = "full-example"
description = "Every optional slot turned on"
owner = "noirbizarre"
author = "Axel H. <noirbizarre@gmail.com>"
copyright_holder = "Axel H."
copyright_year = 2026
keywords = "cli, example, template, rust, scaffolding"
categories = ["command-line-utilities", "development-tools"]
bin_name = "full-example"
kind = "library-and-binary"
msrv = true
mbx = true
msrv_version = "1.88"
man_pages = true
archive = true
service = true
rolling_prerelease = true
publish = true
docs = true
logos = ["wordmark", "icon", "raster-wordmark", "raster-icon"]
docs_accent = "deep orange"
homebrew = true
homebrew_tap = "noirbizarre/homebrew-tap"
aur = true
targets = [
  "x86_64-unknown-linux-gnu",
  "aarch64-unknown-linux-gnu",
  "x86_64-unknown-linux-musl",
  "aarch64-unknown-linux-musl",
  "x86_64-apple-darwin",
  "aarch64-apple-darwin",
  "x86_64-pc-windows-msvc",
  "aarch64-pc-windows-msvc",
  "x86_64-unknown-freebsd",
]

# Every conditional slot on. The mirror of `minimal`: what that one asserts is
# absent, this asserts is present, so a slot that stopped rendering altogether
# fails here rather than passing both cases quietly.
[expect]
absent = ["NEXT-STEPS.md", "NEXT-STEPS.md.jinja", "commitlint.config.mjs", ".markdownlint-cli2.yaml"]
files = [
  ".cz.toml",
  ".github/workflows/docs.yaml",
  ".github/workflows/template.yaml",
  "zensical.toml",
  "docs/index.md",
  "docs/images/logo.svg",
  "docs/images/icon.svg",
  "docs/images/logo.png",
  "docs/images/icon.png",
  "docs/adr/README.md",
  "Cargo.toml",
  ".editorconfig",
  ".config/rumdl.toml",
  "build.rs",
  ".github/workflows/homebrew.yaml",
  ".github/workflows/aur.yaml",
  "packaging/homebrew/full-example.rb",
  "packaging/aur/full-example-bin/PKGBUILD",
  "packaging/systemd/full-example.service",
]

[expect.contains]
"README.md" = ['src="docs/images/logo.svg"']
"docs/index.md" = ['src="images/logo.svg"']
".github/workflows/docs.yaml" = [
  "jdx/mise-action@v5",
  "on:\n  pull_request:",
  "  build:\n    name: 📝 Build documentation",
  "run: mise run docs:build",
  "uses: actions/upload-pages-artifact@v5\n        if: github.event_name != 'pull_request'",
  "  deploy:\n    name: 🌐 Publish documentation\n    if: github.event_name != 'pull_request'",
  "    permissions:\n      pages: write\n      id-token: write",
  "    concurrency:\n      group: pages\n      cancel-in-progress: false",
]
"Cargo.toml" = [
  'name = "full-example"',
  'rust-version = "1.88"',
  "[package.metadata.binstall]",
  "[package.metadata.binstall.overrides.aarch64-pc-windows-msvc]",
  "[build-dependencies]",
  "clap_mangen",
]
# The MSRV job reads this value from Cargo.toml, so the two have to
# agree — and they are rendered from different answers in different files.
".github/workflows/ci.yaml" = [
  "cargo llvm-cov nextest --profile ci --lcov --output-path lcov.info",
  "jdx/mise-action@v5",
  "jdx/mr-boxington-action@v1", "run: mbx check --all-targets", "mbx build --locked", "cache-generation: lint-v1", "cache-generation: pr-build-${{ matrix.build.target }}-v1",
  "🧓 MSRV", "rust-version", "id-token: write", "  prerelease:", "name: 🚀 Development prerelease", "ref: ${{ github.sha }}", "if: github.event_name == 'pull_request'",
  "    uses: ./.github/workflows/publish-release.yaml\n    # Environment secrets also require forwarding across workflow_call.\n    secrets: inherit\n    with:",
  "      matrix:\n        build:\n          - { label: linux-amd64, target: x86_64-unknown-linux-gnu, runner: ubuntu-latest, cross: true }",
  "runs-on: ${{ matrix.build.runner }}",
  "targets: ${{ matrix.build.target }}",
  "uses: ./.github/actions/setup-windows\n        if: runner.os == 'Windows'",
  "run: ./.github/actions/setup-windows/verify.ps1",
  '''LLVM_PROFILE_FILE_NAME: ${{ runner.os == 'macOS' && '%m.profraw' || '%m-%b.profraw' }}''',
  '''RUSTFLAGS: ${{ runner.os == 'Windows' && '-C link-arg=/build-id' || runner.os == 'Linux' && '-C link-arg=-Wl,--build-id=sha1' || '' }}''',
  "name: Upload coverage artifacts\n        if: ${{ always() && runner.debug == '1' }}\n        # Diagnostic upload failures must not fail tests or block Codecov uploads.\n        continue-on-error: true", "retention-days: 7",
  "target/llvm-cov-target/*.profraw", "target/llvm-cov-target/*-profraw-list",
]
".github/workflows/prepare-release.yaml" = [
  "fetch-depth: 0",
  "cargo update --workspace",
  "gh ship sign",
  "name: ship-release",
  "path: ship.release.json",
  "if-no-files-found: error",
]
".github/workflows/publish-release.yaml" = [
  "jdx/mr-boxington-action@", "backend: local", "mbx build --release --locked",
  "    environment:\n      name: release",
  "          client-id: ${{ vars.APP_CLIENT_ID }}\n          private-key: ${{ secrets.APP_PRIVATE_KEY }}",
  "crates.io",
  # archive = true: the tarball step, in the layout memcastle's ADR-013 fixes.
  "Package the Unix binaries",
  "Generate man pages and completions",
  "share/doc/full-example",
  "lib/systemd/user/full-example.service",
  "gzip -n -9",
  "cancel-in-progress: false",
  "actions/download-artifact",
  "name: Publish to crates.io\n        if: startsWith(inputs.ref || github.ref, 'refs/tags/')",
  "aarch64-pc-windows-msvc",
  "x86_64-unknown-freebsd",
  "target-feature=+crt-static",
  "Build and stage the asset",
  "matrix.build.label",
  "vars.PRERELEASE_NAME || 'development'",
  "uses: ./.github/actions/setup-windows\n        if: runner.os == 'Windows'",
  "run: ./.github/actions/setup-windows/verify.ps1",
]
"zensical.toml" = ['accent = "deep orange"', 'logo = "images/icon.svg"', 'favicon = "images/icon.svg"']
"mise.toml" = ["docs:build", "lint:md", 'rumdl check .', 'tools = { rumdl = "0.3.2" }', "[tasks.man]", 'mr_boxington = true', 'mr-boxington = "latest"', 'version = "stable"', '# --- begin project-specific tools ---', '# --- end project-specific tools ---']
".config/rumdl.toml" = [
  'exclude = ["./CHANGELOG.md"]',
  "# https://rumdl.dev/md013/\n[MD013]",
  'line-length = 120',
  'heading-line-length = 120',
  'tables = false',
  'code-blocks = false',
  "# https://rumdl.dev/md033/\n  \"MD033\"",
  "# https://rumdl.dev/md041/\n  \"MD041\"",
  "# https://rumdl.dev/md060/\n  \"MD060\"",
]
"CONTRIBUTING.md" = ["Mise's postinstall hook installs both", "Settings → Pages", "**GitHub Actions**", "Onboard `noirbizarre/full-example` to Codecov", "Trusted Publishing", "owner `noirbizarre`, repository `full-example`", "`publish-release.yaml`, and environment `release`"]
# Regression tripwire for the bot-contributor filter: `github.contributors`
# is unfiltered by `commit_parsers`, so without this every bot with a merged
# PR — dependabot, the release bot — would be credited as a first-timer.
"cliff.toml" = ['is ending_with("[bot]")']
"prek.toml" = [
  '''exclude = { glob = [
  "CHANGELOG.md",
  "Cargo.lock",
  "mise.lock",
] }''',
  'repo = "https://github.com/rvben/rumdl-pre-commit"',
  'id = "rumdl-check"',
  'id = "rumdl-fmt"',
  'id = "editorconfig-checker"',
  'repo = "https://github.com/commitizen-tools/commitizen"',
  'id = "commitizen"',
  'additional_dependencies = ["emotional==0.6.1"]',
  'repo = "https://github.com/crate-ci/typos"',
  'stages = ["commit-msg"]',
]
".cz.toml" = ['[tool.commitizen]', 'name = "emotional"']
"packaging/homebrew/full-example.rb" = [
  "class FullExample",
  "@SHA256_DARWIN_ARM64@",
  "@SHA256_LINUX_AMD64_MUSL@",
  "@SHA256_LINUX_ARM64_MUSL@",
  "man1.install",
  "zsh_completion.install",
]
"packaging/aur/full-example-bin/PKGBUILD" = [
  "pkgname=full-example-bin",
  "_pkgname=full-example",
  'provides=("$_pkgname=$pkgver")',
  'conflicts=("$_pkgname")',
  "@SHA256_X86_64@",
  "@SHA256_AARCH64@",
  "linux-amd64.tar.gz",
  "cp -a lib",
]
"packaging/systemd/full-example.service" = ["ExecStart=/usr/bin/full-example"]
".github/workflows/homebrew.yaml" = ["noirbizarre/homebrew-tap"]
".github/workflows/aur.yaml" = ["full-example-bin"]

[expect.lacks]
"README.md" = ['src="docs/images/icon.svg"', '<h1 align="center">full-example</h1>']
"docs/index.md" = ['src="images/icon.svg"', "# full-example"]
"CONTRIBUTING.md" = ["prek install", "commitlint"]
"prek.toml" = ["commitlint", "markdownlint", "tests/snapshots/", "tests/fixtures/", "__snapshots__"]
"mise.toml" = ["markdownlint", "npx"]
".gitignore" = ["commitlint", "node_modules/"]
".github/workflows/ci.yaml" = ["cargo llvm-cov clean", "--no-report", "cargo llvm-cov report", "sccache", "Swatinem/rust-cache", "RUSTC_WRAPPER", "--release", "build: false", "needs: [lint", "  development:", "name: Upload build artifacts", "save-on-pull-request:", "windows_test_temp", "cygpath"]
".github/workflows/publish-release.yaml" = ["inputs.build", "inputs.tag", "inputs.prerelease", "needs.resolve", "  resolve:", "  crates:", "include:", 'ext: ""', "build-release.yaml", "Swatinem/rust-cache", "github-cache-mode:"]
# Historical spelling must not make git-cliff silently drop release commits.
"cliff.toml" = ["typos --write-changes"]
# PR CI builds the release; the orchestrator validates the uploaded artifact.
".github/workflows/prepare-release.yaml" = [
  "cargo build",
  "Swatinem/rust-cache",
  "gh ship validate ship.release.json",
  "fetch-tags:",
]
# archive = true: the licence and unit come out of the tarball, so the AUR
# workflow must not also fetch and hash them from the tag.
".github/workflows/aur.yaml" = ["SHA256_LICENSE", "SHA256_SERVICE"]
"packaging/aur/full-example-bin/PKGBUILD" = ["SHA256_LICENSE"]

[commands]
rendered = [
  # Exercise the emitted script, including workspace inheritance and invalid metadata.
  '''python3 - <<'PY'
import json
import os
import pathlib
import subprocess
import tempfile

workflow = json.loads(subprocess.check_output(["yq", "-o", "json", ".", ".github/workflows/ci.yaml"]))
script = next(step["run"] for step in workflow["jobs"]["msrv"]["steps"] if step.get("id") == "msrv")
cases = [
    ("[package]\nrust-version = '1.88'\n", "1.88"),
    ("[package]\n  rust-version='1.89' # a comment\n", "1.89"),
    ("[workspace.package]\nrust-version='1.88'\n", "1.88"),
    ("[package]\nrust-version.workspace=true\n[workspace.package]\nrust-version='1.89'\n", "1.89"),
    ("[package]\nrust-version='1.90'\n[workspace.package]\nrust-version='1.88'\n", "1.90"),
    ("[package]\nname='missing'\n", None),
    ("[package]\nrust-version=''\n", None),
    ("[package]\nrust-version=190\n", None),
    ("[package]\nrust-version.workspace=false\n", None),
]
for manifest, expected in cases:
    with tempfile.TemporaryDirectory() as directory:
        root = pathlib.Path(directory)
        (root / "Cargo.toml").write_text(manifest)
        output = root / "output"
        result = subprocess.run(["bash", "-euo", "pipefail", "-c", script], cwd=root,
            env=dict(os.environ, GITHUB_OUTPUT=str(output)), capture_output=True, text=True)
        if expected is None:
            assert result.returncode != 0, manifest
        else:
            assert result.returncode == 0, result.stdout + result.stderr
            assert output.read_text() == "version=" + expected + "\n", manifest
PY''',
  "mise run lint:md",
  "mise test",
  # prek requires files to be git-tracked
  "git init -q",
  "git add .",
  "prek -a",
  "gh ship validate",
]
